name: Build

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build Deno Deploy bundle
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.25.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            # The private core is consumed as a packed tarball next to this repo.
            # Build it from the pinned ruxt-core commit until a GitHub Packages
            # read token is configured for this repository.
            - name: Build private core tarball
              env:
                  RUXT_CORE_REF: ec01245
              run: |
                  git clone https://github.com/TuanKietTran/ruxt-core.git ../ruxt-core
                  git -C ../ruxt-core checkout "$RUXT_CORE_REF"
                  pnpm --dir ../ruxt-core install --frozen-lockfile --ignore-scripts
                  pnpm --dir ../ruxt-core build
                  mkdir -p ../package-artifacts/phase4
                  pnpm --dir ../ruxt-core pack --pack-destination ../package-artifacts/phase4

            # The core tarball is rebuilt here from a pinned commit, so its
            # checksum is refreshed instead of compared with the local build's.
            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile --update-checksums

            - name: Test
              run: pnpm test

            - name: Architecture lint
              run: pnpm lint

            - name: Build (Deno Deploy preset)
              run: pnpm build
              env:
                  NITRO_PRESET: deno-deploy
