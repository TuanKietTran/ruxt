name: Build

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build Deno Deploy bundle
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.25.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm test

            - name: Architecture lint
              run: pnpm lint

            - name: Build (Deno Deploy preset)
              run: pnpm build
              env:
                  NITRO_PRESET: deno-deploy
